          function specIcon(label) {
            const rules = [
              [/نمایشگر|صفحه/, "ti-device-mobile"],
              [/گرافیک|GPU/i, "ti-device-desktop-analytics"],
              [/پردازنده|CPU|چیپست/i, "ti-cpu"],
              [/رم|RAM/i, "ti-brain"],
              [/حافظه داخلی|ROM|ظرفیت/i, "ti-device-sd-card"],
              [/دوربین/, "ti-camera"],
              [/باتری/, "ti-battery-4"],
              [/شارژ/, "ti-bolt"],
              [/سیستم[\s\u200c]?عامل|OS/i, "ti-brand-android"],
              [/شبکه|5G|4G/i, "ti-antenna"],
              [/بلوتوث/, "ti-bluetooth"],
              [/وای[\s\u200c]?فای|wifi/i, "ti-wifi"],
              [/پورت|USB/i, "ti-usb"],
              [/وزن/, "ti-weight"],
              [/ابعاد|اندازه/, "ti-ruler-2"],
              [/سیم[\s\u200c]?کارت|SIM/i, "ti-device-sim"],
              [/آب|IP6/i, "ti-droplet"],
              [/جانبی|SD|کارت حافظه/i, "ti-device-sd-card"],
              [/رنگ/, "ti-palette"],
              [/گارانتی/, "ti-shield-check"],
            ];
            const match = rules.find(([re]) => re.test(label));
            return match ? match[1] : "ti-info-circle";
          }

          function syncVariantSelection(preferredStorage, preferredColorName) {
            if (!product.hasStorage) {
              selectedColor = product.colors.find((color) => color.name === preferredColorName) || selectedColor;
              const colorValue = document.getElementById("colorVal");
              if (colorValue) colorValue.textContent = selectedColor.name;
              document.querySelectorAll(".color-swatch").forEach((swatch) => swatch.classList.toggle("active", swatch.dataset.name === selectedColor.name));
              return true;
            }
            const variants = Array.isArray(product.variants) ? product.variants.filter((variant) => variant.stock > 0) : [];
            if (!variants.length) {
              selectedStorage = preferredStorage || selectedStorage;
              selectedColor = product.colors.find((color) => color.name === preferredColorName) || selectedColor;
              document.getElementById("storageVal").textContent = selectedStorage;
              document.getElementById("colorVal").textContent = selectedColor.name;
              document.querySelectorAll(".storage-chip").forEach((chip) => chip.classList.toggle("active", chip.dataset.val === selectedStorage));
              document.querySelectorAll(".color-swatch").forEach((swatch) => swatch.classList.toggle("active", swatch.dataset.name === selectedColor.name));
              return true;
            }
            const selected = variants.find((variant) => variant.storage === preferredStorage && variant.color.name === preferredColorName)
              || variants.find((variant) => variant.storage === preferredStorage)
              || variants.find((variant) => variant.color.name === preferredColorName)
              || variants[0];
            selectedStorage = selected.storage;
            selectedColor = selected.color;
            maxQuantity = selected.stock;
            qty = Math.min(Math.max(1, qty), maxQuantity);
            document.getElementById("storageVal").textContent = selectedStorage;
            document.getElementById("colorVal").textContent = selectedColor.name;
            document.getElementById("qtyVal").textContent = qty;
            document.querySelectorAll(".storage-chip").forEach((chip) => {
              const enabled = variants.some((variant) => variant.storage === chip.dataset.val);
              chip.classList.toggle("active", chip.dataset.val === selectedStorage);
              chip.disabled = !enabled;
              chip.style.opacity = enabled ? "1" : ".38";
              chip.style.cursor = enabled ? "pointer" : "not-allowed";
            });
            document.querySelectorAll(".color-swatch").forEach((swatch) => {
              const enabled = variants.some((variant) => variant.storage === selectedStorage && variant.color.name === swatch.dataset.name);
              swatch.classList.toggle("active", swatch.dataset.name === selectedColor.name);
              swatch.classList.toggle("unavailable", !enabled);
              swatch.setAttribute("aria-disabled", enabled ? "false" : "true");
              swatch.style.opacity = enabled ? "1" : "";
              swatch.style.cursor = enabled ? "pointer" : "not-allowed";
            });
            const quantityHint = document.querySelector(".quantity-row")?.previousElementSibling?.querySelector(".selected-val");
            if (quantityHint) quantityHint.textContent = "(حداکثر " + maxQuantity.toLocaleString("fa-IR") + " عدد)";
            return true;
          }

          function syncReviewSummary() {
            const total = demoReviews.length;
            const average = total
              ? demoReviews.reduce((sum, review) => sum + Number(review.rating || 0), 0) / total
              : 0;
            const rating = total ? average.toFixed(1) : "۰";
            product.rating = rating;
            product.reviews = total.toLocaleString("fa-IR");

            document.getElementById("reviewsOverallScore").textContent = rating;
            document.getElementById("reviewsOverallStars").innerHTML = starsHtml(rating, "18px");
            document.getElementById("reviewsOverallCount").textContent = `از ${product.reviews} نظر ثبت‌شده`;
            document.getElementById("scrollToReviewsBtn").textContent = `(${product.reviews} نظر)`;
          }
          function updateRatingBreakdown() {
            const total = demoReviews.length;
            const counts = [5, 4, 3, 2, 1].map(
              (rating) =>
                demoReviews.filter((review) => Number(review.rating) === rating)
                  .length,
            );

            counts.forEach((count, index) => {
              const rating = 5 - index;
              const percentage = total ? Math.round((count / total) * 100) : 0;
              const bar = document.querySelector(
                `[data-rating-bar="${rating}"]`,
              );
              const label = document.querySelector(
                `[data-rating-count="${rating}"]`,
              );
              if (bar) bar.style.width = `${percentage}%`;
              if (label)
                label.textContent = `${percentage.toLocaleString("fa-IR")}٪`;
            });
          }

          function renderReviews() {
            syncReviewSummary();
            const sortMode = document.getElementById("reviewsSortSelect").value;
            let sorted = [...demoReviews];
            if (sortMode === "helpful")
              sorted.sort((a, b) => b.helpful - a.helpful);
            if (sortMode === "highest")
              sorted.sort((a, b) => b.rating - a.rating);
            if (sortMode === "lowest")
              sorted.sort((a, b) => a.rating - b.rating);
            const visible = sorted.slice(0, reviewsShown);
            reviewsListEl.innerHTML = visible.length
              ? visible.map(
                (r) => `
            <div class="review-card">
              <div class="review-card-head">
                <div class="review-avatar">${r.name.trim().charAt(0)}</div>

                  <div class="review-user-name">${r.name} ${r.verified ? '<span class="verified-badge"><i class="ti ti-discount-check"></i> خرید تایید شده</span>' : ""}</div>

              <div class="stars">${starsHtml(String(r.rating))}</div>

              ${
                r.pros.length || r.cons.length
                  ? `<div class="review-proscons">
                      ${r.pros.map((p) => `<span class="p-item"><i class="ti ti-thumb-up"></i>${p}</span>`).join("")}
                      ${r.cons.map((c) => `<span class="c-item"><i class="ti ti-thumb-down"></i>${c}</span>`).join("")}

                  : ""
              }
              <div class="review-card-footer">
                <button class="helpful-btn" data-helpful="${r.helpful}"><i class="ti ti-thumb-up"></i> مفید بود (<span>${r.helpful}</span>)</button>
              </div>
              ${
                r.reply
                  ? `<div class="store-reply"><strong>پاسخ پیکسل لایف:</strong> ${r.reply}</div>`
                  : ""
              }
            </div>`,
              ).join("")
              : '<div class="reviews-empty">هنوز نظری برای این محصول ثبت نشده است. اولین نفری باشید که نظر خود را ثبت می‌کند.</div>';
            updateRatingBreakdown();
            document.getElementById("loadMoreReviewsBtn").style.display =
              reviewsShown >= sorted.length ? "none" : "block";
            reviewsListEl.querySelectorAll(".helpful-btn").forEach((btn) => {
              btn.addEventListener("click", () => {
                if (btn.classList.contains("liked")) return;
                btn.classList.add("liked");
                const span = btn.querySelector("span");
                span.textContent = parseInt(span.textContent, 10) + 1;
              });
            });

          renderReviews();

            .getElementById("reviewsSortSelect")
            .addEventListener("change", () => {
              reviewsShown = 2;

            .getElementById("loadMoreReviewsBtn")

          /* ══ REAL REVIEW SYSTEM LOGIC ══ */
          const reviewModal = document.getElementById("reviewModal");

          const submitReviewBtn = document.getElementById("submitReviewBtn");
          const starRatingInput = document.getElementById("starRatingInput");

          function openReviewModal() {

            document.getElementById("reviewProsInput").value = "";

          function updateStarInput(val) {
            starRatingInput.querySelectorAll("i").forEach((s, idx) => {
              s.classList.toggle("active", idx < val);
              s.className =
                idx < val ? "ti ti-star-filled active" : "ti ti-star";

            currentReviewRating = parseInt(star.dataset.val, 10);
            updateStarInput(currentReviewRating);

          submitReviewBtn.addEventListener("click", async () => {
            const comment = document
              .getElementById("reviewCommentInput")
              .value.trim();
            if (!comment) {
              showToast("لطفا متن نظر خود را وارد کنید");
              return;
            }
            const prosText = document
              .getElementById("reviewProsInput")
              .value.trim();
            const consText = document
              .getElementById("reviewConsInput")
              .value.trim();

            let userName = "کاربر مهمان";
            try {
              const u = JSON.parse(localStorage.getItem("user"));
              if (u) userName = u.mobile || u.email || "کاربر";
            } catch (e) {}

            const newReview = {
              productId: productId,
              userName: userName,
              rating: currentReviewRating,
              comment: comment,
              pros: prosText ? [prosText] : [],
              cons: consText ? [consText] : [],
              verified: false,
              helpful: 0,
              reply: null,
            };

            try {
              submitReviewBtn.disabled = true;
              submitReviewBtn.innerHTML =
                '<i class="ti ti-loader ti-spin"></i> در حال ثبت...';

              const response = await fetch("/api/reviews", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newReview),
              });

              const data = await response.json();

              if (!response.ok || !data.success) {
                throw new Error(data.error || "ثبت نظر ناموفق بود");
              }

              if (data.success) {
                demoReviews.unshift({
                  name: data.review.userName,
                  verified: data.review.verified,
                  rating: data.review.rating,
                  date: "همین الان",
                  comment: data.review.comment,
                  pros: data.review.pros,
                  cons: data.review.cons,
                  helpful: data.review.helpful,
                  reply: data.review.reply,
                });
                renderReviews();

                const reviewsCountEl =
                  document.getElementById("scrollToReviewsBtn");
                if (reviewsCountEl) {
                  const newCount =
                    (parseInt(
                      product.reviews.replace(/[۰-۹]/g, (d) =>
                        "۰۱۲۳۴۵۶۷۸۹".indexOf(d),
                      ),
                    ) || 0) + 1;
                  product.reviews = newCount.toLocaleString("fa-IR");
                  reviewsCountEl.textContent = `(${product.reviews} نظر)`;
                }

                closeReviewModal();
                showToast("نظر شما با موفقیت در دیتابیس ثبت شد");

                document
                  .getElementById("customerReviewsSection")
                  .scrollIntoView({ behavior: "smooth", block: "start" });
              }
            } catch (error) {
              showToast("خطا در ارتباط با سرور");
            } finally {
              submitReviewBtn.disabled = false;
              submitReviewBtn.innerHTML = '<i class="ti ti-check"></i> ثبت نظر';
            }
          });

          async function loadRelatedProducts() {
            try {
              const res = await fetch(
                `/api/products?brand=${encodeURIComponent(product.brand)}&exclude=${productId}&limit=8`,
              );
              if (res.ok) {
                const data = await res.json();
                if (
                  data.success &&
                  Array.isArray(data.products) &&
                  data.products.length
                ) {
                  const mapped = data.products.map((d) => [
                    String(d._id),
                    mapDbProductToView(d),
                  ]);
                  document.getElementById("relatedSlider").innerHTML = mapped
                    .map(([id, p]) => miniCard(id, p))
                    .join("");
                  return;
                }
              }
            } catch (e) {
              console.warn("محصولات مشابه از سرور دریافت نشد:", e);
            }
            // fallback فقط وقتی سرور چیزی نداد
            const relatedIds = Object.keys(PRODUCTS).filter(
              (id) =>
                id !== productId &&
                (PRODUCTS[id].brand === product.brand ||
                  !!PRODUCTS[id].isTablet === !!product.isTablet),
            );
            document.getElementById("relatedSlider").innerHTML = relatedIds
              .slice(0, 8)
              .map((id) => miniCard(id, PRODUCTS[id]))
              .join("");
          }
          deferNonCriticalWork(loadRelatedProducts);

          const recentIds = getRecentlyViewed().filter(
            (id) => id !== productId && PRODUCTS[id],
          );
          if (recentIds.length) {
            document.getElementById("recentlyViewedBlock").style.display = "";
            document.getElementById("recentSlider").innerHTML = recentIds
              .slice(0, 8)
              .map((id) => miniCard(id, PRODUCTS[id]))
              .join("");
          }

          document.querySelectorAll(".slider-add-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.id;
              const p = PRODUCTS[id];
              if (!p || p.outOfStock) {
                showToast("این محصول در حال حاضر ناموجود است");
                return;
              }
              const cart = getCart();
              const existing = cart.find((item) => item.id === id);
              if (existing) existing.qty = (existing.qty || 1) + 1;
              else
                cart.push({
                  id,
                  name: p.name,
                  storage: p.storages[0],
                  color: p.colors[0].name,
                  brand: p.brand || "",
                  variant: p.storages[0],
                  image: p.images?.[0] || "",
                  price: p.price,
                  qty: 1,
                });
              saveCart(cart);
              showToast("به سبد خرید اضافه شد");
            });
          });
          document.querySelectorAll(".slider-wish-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.id;
              let list = getWishlist();
              if (!list.includes(id)) {
                list.push(id);
                saveWishlist(list);
                btn.querySelector("i").className = "ti ti-heart-filled";
                showToast("به علاقه‌مندی‌ها اضافه شد");
              }
            });
          });
          document.querySelectorAll(".slider-nav-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const track = document.getElementById(btn.dataset.slider);
              const dir = btn.classList.contains("slider-nav-next") ? -1 : 1;
              track.scrollBy({ left: dir * 220, behavior: "smooth" });
            });
          });

          const notifyBtn = document.getElementById("notifyBtn");
          if (notifyBtn) {
            notifyBtn.addEventListener("click", () => {
              showToast("به محض موجود شدن به شما اطلاع می‌دهیم");
            });
          }

          function addCurrentToCart() {
            const cart = getCart();
            const existing = cart.find(
              (item) =>
                item.id === productId &&
                item.storage === selectedStorage &&
                item.color === selectedColor.name,
            );
            if (existing) {
              const allowed = product._fromDb ? maxQuantity : 10;
              const requested = (existing.qty || 1) + qty;
              existing.qty = Math.min(requested, allowed);
              if (requested > allowed) {
                showToast(`تعداد این محصول در سبد به موجودی ${allowed.toLocaleString("fa-IR")} عدد محدود شد`);
              }
            } else {
              cart.push({
                id: productId,
                name: product.name,
                storage: selectedStorage,
                color: selectedColor.name,
                warranty: selectedWarranty,
                brand: product.brand || "",
                variant: selectedStorage,
                image: product.images?.[0] || "",
                price: product.price,
                stock: maxQuantity,
                qty: qty,
              });
            }
            saveCart(cart);
          }
          const addCartBtn = document.getElementById("addCartBtn");
          if (addCartBtn) {
            addCartBtn.addEventListener("click", () => {
              addCurrentToCart();
              showToast("به سبد خرید اضافه شد");
            });
          }
          // بارگذاری نظرات ذخیره‌شده پس از آماده‌شدن صفحه
          deferNonCriticalWork(fetchReviews);
        }
      })();
    </script>
  </body>
</html>
