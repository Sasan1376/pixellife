        font-size: 18px;
        color: var(--text-3);
      }
      .nav-cats-dropdown a:hover i {
        color: var(--blue);
      }

      /* BREADCRUMB */
      .breadcrumb {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 32px 0;
        font-size: 12.5px;
        color: var(--text-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .breadcrumb a {
        color: var(--text-3);
        transition: color 0.15s;
      }
      .breadcrumb a:hover {
        color: var(--blue);
      }
      .breadcrumb i {
        font-size: 11px;
        color: var(--text-4);
      }
      .breadcrumb .current {
        color: var(--text-1);
        font-weight: 600;
      }

      /* PAGE BODY */
      .page-body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 32px 40px;
      }

      /* PRODUCT HERO */
      .product-layout {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 40px;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        align-items: start;
      }

      /* Gallery */
      .product-gallery {
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: relative;
      }
      #galleryImgHolder {
        width: 100%;
        min-width: 0;
        overflow: hidden;
      }
      .gallery-track {
        display: flex;
        direction: ltr;
        width: 100%;
        transition: transform 260ms cubic-bezier(0.22, 0.72, 0, 1);
        will-change: transform;
      }
      .gallery-track.is-dragging {
        transition: none;
      }
      .gallery-slide {
        flex: 0 0 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mobile-gallery-counter {
        display: none;
      }
      .gallery-main {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 620px;
        background: #fff;
        border: 0;
        border-radius: 0;
        overflow: hidden;
        cursor: zoom-in;
      }
      .gallery-main svg,
      .gallery-main img {
        max-height: 500px;
        max-width: 100%;
        width: auto;
        object-fit: contain;
        mix-blend-mode: multiply;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* ویدیو نباید افکت ترکیب‌رنگِ تصویر محصول را بگیرد. */
      .gallery-main video {
        display: block;
        max-height: 500px;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        mix-blend-mode: normal;
        background: #0b0f19;
      }
      /* تا دریافت نخستین فریم ویدیو، پلیر سیاه native نمایش داده نمی‌شود. */
      .gallery-video-shell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 260px;
        overflow: hidden;
        background: #f7f9fc;
      }
      .gallery-video-shell video {
        position: relative;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .gallery-video-shell.is-ready video {
        opacity: 1;
      }
      .gallery-video-loading {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #748197;
        font-size: 13px;
        font-weight: 700;
        background: #f7f9fc;
        transition: opacity 0.18s ease, visibility 0.18s ease;
        pointer-events: none;
      }
      .gallery-video-shell.is-ready .gallery-video-loading {
        opacity: 0;
        visibility: hidden;
      }
      .gallery-video-loading__dots {
        display: inline-flex;
        gap: 6px;
      }
      .gallery-video-loading__dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--blue);
        animation: gallery-video-dot 0.9s ease-in-out infinite;
      }
      .gallery-video-loading__dots i:nth-child(2) { animation-delay: 0.12s; }
      .gallery-video-loading__dots i:nth-child(3) { animation-delay: 0.24s; }
      @keyframes gallery-video-dot {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-5px); opacity: 1; }
      }

      .gallery-main:hover svg,
      .gallery-main:hover img {
        transform: scale(1.06);
      }
      .gallery-main .zoom-hint {
        position: absolute;
        bottom: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--overlay);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .gallery-main:hover .zoom-hint {
        opacity: 1;
      }
      .gallery-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--white);
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        box-shadow: var(--shadow-sm);
        z-index: 2;
        transition: all 0.15s;
      }
      .gallery-nav-btn:hover {
        color: var(--blue);
        border-color: var(--blue);
      }
      .gallery-nav-prev {
        right: 12px;
      }
      .gallery-nav-next {
        left: 12px;
      }
      .gallery-thumbs {
        display: flex;
        gap: 10px;
        flex-wrap: nowrap;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        height: 76px;
        box-sizing: border-box;
        padding: 4px 2px 8px;
        scrollbar-width: thin;
        scroll-behavior: smooth;
      }
      .gallery-thumb {
        width: 66px;
        height: 66px;
        min-width: 66px;
        max-width: 66px;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--border);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .gallery-thumb svg,
      .gallery-thumb img,
      .gallery-thumb video {
        max-height: 48px;
        max-width: 100%;
        width: auto;
        object-fit: contain;
      }
      .gallery-thumb:hover {
        border-color: var(--blue-mid);
      }
      .gallery-thumb.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-light);
      }
      .gallery-variant-1 {
        transform: scaleX(-1);
      }
      .gallery-variant-2 {
        filter: brightness(0.94) saturate(1.05);
      }
      .gallery-variant-3 {
        transform: rotate(-4deg);
      }
      .video-gallery-thumb {
        width: 100%;
        height: 100%;
        position: relative;
        display: block;
        overflow: hidden;
        background: #0f172a;
      }
      .video-gallery-thumb video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #0f172a;
      }
      .video-gallery-thumb__label {
        position: absolute;
        right: 4px;
        bottom: 4px;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.78);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.25;
      }
      .gallery-main video {
        cursor: default;
        background: #000;
      }

      /* Fullscreen gallery modal */
      .fullscreen-gallery {
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 18, 0.94);
        z-index: 9500;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s ease,
          visibility 0.25s;
      }
      .fullscreen-gallery.open {
        opacity: 1;
        visibility: visible;
      }
      .fullscreen-gallery img,
      .fullscreen-gallery svg,
      .fullscreen-gallery video {
        max-height: 78vh;
        max-width: 78vw;
        object-fit: contain;
        filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.5));
      }
      .fullscreen-close {
        position: absolute;
        top: 24px;
        left: 24px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fullscreen-close:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .fullscreen-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fullscreen-nav:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .fullscreen-prev {
        right: 28px;
      }
      .fullscreen-next {
        left: 28px;
      }
      .fullscreen-counter {
        position: absolute;
        bottom: 26px;
        right: 50%;
        transform: translateX(50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        font-weight: 600;
      }
      .fullscreen-thumbs {
        position: absolute;
        right: 18px;
        left: 18px;
        bottom: 14px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 0;
        justify-content: center;
        z-index: 2;
      }
      .fullscreen-thumb {
        width: 72px;
        height: 58px;
        flex: 0 0 auto;
        padding: 3px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
      }
      .fullscreen-thumb.active {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.25);
      }
      .fullscreen-thumb img,
      .fullscreen-thumb svg {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: contain;
        filter: none;
      }

      .product-badges {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 2;
      }
      .badge-coming-soon,
      .badge-amazing,
      .badge-out-of-stock,
      .badge-discount {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 14px;
        border-radius: 999px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .badge-coming-soon {
        background: var(--blue);
      }
      .badge-amazing { background: #dc2626; box-shadow: 0 4px 12px rgba(220,38,38,.28); }
      .amazing-countdown { position:absolute; top:12px; left:12px; right:auto; z-index:3; display:inline-flex; align-items:center; gap:7px; color:#be123c; background:#fff1f2; border:1px solid #fecdd3; border-radius:9px; padding:7px 10px; font-weight:800; font-size:12px; }
      .badge-out-of-stock {
        background: var(--red);
      }
      .badge-discount {
        background: var(--green);
      }

      /* Info column */
      .product-info-col {
        display: flex;
        flex-direction: column;
      }
      .product-brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .product-brand-badge {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .product-brand-badge svg {
        width: 18px;
        height: 22px;
      }
      .product-brand-badge span {
        font-size: 12.5px;
        color: var(--text-3);
        font-weight: 600;
      }
      .action-icons-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-action-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--white);
        color: var(--text-3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        transition: all 0.15s;
        position: relative;
      }
      .icon-action-btn:hover {
        border-color: var(--blue);
        color: var(--blue);
        background: var(--blue-light);
      }
      .icon-action-btn.active {
        border-color: var(--red);
        color: var(--red);
        background: var(--danger-bg);
      }
      .icon-action-btn.active i {
        font-weight: 700;
      }

      /* قلب علاقه‌مندی بدون وابستگی به فونت آیکون نمایش داده می‌شود */
      #wishBtn i {
        display: none;
      }
      #wishBtn::before {
        content: "♡";
        font-family: Arial, sans-serif;
        font-size: 27px;
        font-weight: 400;
        line-height: 1;
        transform: translateY(-1px);
      }
      #wishBtn.active::before {
        content: "♥";
        font-size: 21px;
        color: var(--red);
      }

      .product-title {
        font-size: 16px;
        font-weight: 400;
        line-height: 1.6;
        color: var(--text-1);
        margin-bottom: 10px;
      }
      .product-rating-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 13px;
        color: var(--text-3);
        flex-wrap: wrap;
      }
      .product-rating-row .stars {
        color: var(--amber);
        display: flex;
        gap: 2px;
      }
      .rating-link {
        color: var(--blue);
        font-weight: 600;
        cursor: pointer;
      }
      .rating-link:hover {
        text-decoration: underline;
      }
      .availability-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .availability-pill.in-stock {
        color: var(--green);
        background: var(--success-bg);
      }
      .availability-pill.out-stock {
        color: var(--red);
        background: var(--danger-bg);
      }
      .product-desc {
        font-size: 13.5px;
        color: var(--text-2);
        line-height: 2;
        margin-bottom: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }

      /* Customer attention note */
      .product-attention {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: -6px 0 24px;
        padding: 13px 14px;
        border: 1px solid var(--blue-mid);
        border-radius: var(--radius-sm);
        background: var(--blue-light);
        color: var(--text-2);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.9;
      }
      .product-attention__icon {
        width: 23px;
        height: 23px;
        flex: 0 0 23px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-style: normal;
        font-weight: 800;
        line-height: 1;
        margin-top: 1px;
      }
      .product-attention__text {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      /* Quick Specs Card - App Store Style */
      .quick-specs-card {
        margin-bottom: 24px;
      }
      .quick-specs-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      .quick-spec-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        min-height: 120px;
        transition: all 0.2s ease;
      }
      .quick-spec-item:hover {
        border-color: var(--blue-mid);
        box-shadow: var(--shadow-sm);
      }
      .quick-spec-item i {
        font-size: 24px;
        color: var(--blue);
      }
      .quick-spec-label {
        font-size: 11.5px;
        color: var(--text-3);
        font-weight: 600;
      }
      .quick-spec-value {
        font-size: 13px;
        color: var(--text-1);
        font-weight: 700;
        line-height: 1.5;
      }
      .btn-more-specs {
        width: 100%;
        height: 46px;
        border: 1.5px solid var(--blue-mid);
        background: var(--blue-light);
        color: var(--blue);
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-more-specs:hover {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      @media (min-width: 600px) {
        .quick-specs-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .option-group {
        margin-bottom: 22px;
      }
      .option-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-2);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .option-label i {
        font-size: 16px;
        color: var(--text-4);
      }
      .option-label .selected-val {
        color: var(--blue);
        font-weight: 600;
        margin-right: 4px;
      }
      .storage-options,
      .color-options,
      .warranty-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .storage-chip,
      .warranty-chip {
        padding: 9px 18px;
        border-radius: 999px;
        border: 1.5px solid var(--border);
        background: var(--bg);
        color: var(--text-2);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .storage-chip:hover,
      .warranty-chip:hover {
        border-color: var(--blue);
        color: var(--blue);
      }
      .storage-chip.active,
      .warranty-chip.active {
        border-color: var(--blue);
        background: var(--blue-light);
        color: var(--blue);
      }
      .color-swatch {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2.5px solid var(--border);
        cursor: pointer;
        position: relative;
        transition: all 0.15s;
      }
      .color-swatch.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-light);
      }
      .color-swatch.unavailable {
        opacity: .38 !important;
        cursor: not-allowed !important;
      }
      .color-swatch::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: inherit;
      }

      /* Quantity selector */
      .quantity-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .quantity-selector {
        display: flex;
        align-items: center;
        border: 1.5px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .qty-btn {
        width: 38px;
        height: 38px;
        border: none;
        background: var(--bg);
        color: var(--text-2);
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .qty-btn:hover {
        background: var(--blue-light);
        color: var(--blue);
      }
      .qty-val {
        width: 42px;
        text-align: center;
        font-weight: 700;
        font-size: 14px;
      }

      .product-price-row {
        margin-top: auto;
        padding-top: 20px;
      }
      .price-availability {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--red);
        background: var(--danger-bg);
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        margin-bottom: 16px;
      }
      .price-availability i {
        font-size: 16px;
      }
      .price-row-values {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .price-value {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-1);
      }
      .price-value .toman {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-3);
        margin-right: 4px;
      }
      .price-old {
        font-size: 15px;
        color: var(--text-4);
        text-decoration: line-through;
      }
      .price-discount-tag {
        font-size: 12px;
        font-weight: 700;
        color: var(--green);
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        padding: 3px 9px;
        border-radius: 6px;
      }

      .purchase-btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-add-cart {
        width: 100%;
        height: 52px;
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s;
      }
      .btn-add-cart {
        background: var(--blue);
      }
      .btn-add-cart:hover {
        background: var(--blue-dark);
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      }
      .btn-add-cart:disabled {
        background: var(--border);
        color: var(--text-4);
        cursor: not-allowed;
        box-shadow: none;
      }
      .btn-notify {
        width: 100%;
        height: 52px;

            gallerySwipe = {
              pointerId: event.pointerId,
              startX: event.clientX,
              startY: event.clientY,
              lastX: event.clientX,
              lastTime: performance.now(),
              velocityX: 0,
              axis: null,
              active: false,
            };
          }, true);

            if (!gallerySwipe || gallerySwipe.pointerId !== event.pointerId || !galleryTrack) return;

            if (!gallerySwipe.axis && Math.max(Math.abs(deltaX), Math.abs(deltaY)) > 7) {
              gallerySwipe.axis = Math.abs(deltaX) > Math.abs(deltaY) * 1.08 ? "horizontal" : "vertical";
            }
            if (gallerySwipe.axis !== "horizontal") return;

            const now = performance.now();
            const elapsed = Math.max(1, now - gallerySwipe.lastTime);

          function updateRatingBreakdown() {
            const total = demoReviews.length;
            const counts = [5, 4, 3, 2, 1].map(
              (rating) =>
                demoReviews.filter((review) => Number(review.rating) === rating)
                  .length,
            );

            counts.forEach((count, index) => {
              const rating = 5 - index;
              const percentage = total ? Math.round((count / total) * 100) : 0;
              const bar = document.querySelector(
                `[data-rating-bar="${rating}"]`,
              );
              const label = document.querySelector(
                `[data-rating-count="${rating}"]`,
              );
              if (bar) bar.style.width = `${percentage}%`;
              if (label)
                label.textContent = `${percentage.toLocaleString("fa-IR")}٪`;
            });
          }

          function renderReviews() {
            syncReviewSummary();
            const sortMode = document.getElementById("reviewsSortSelect").value;
            let sorted = [...demoReviews];
            if (sortMode === "helpful")
              sorted.sort((a, b) => b.helpful - a.helpful);
            if (sortMode === "highest")
              sorted.sort((a, b) => b.rating - a.rating);
            if (sortMode === "lowest")
              sorted.sort((a, b) => a.rating - b.rating);
            const visible = sorted.slice(0, reviewsShown);
            reviewsListEl.innerHTML = visible.length
              ? visible.map(
                (r) => `
            <div class="review-card">
              <div class="review-card-head">
                <div class="review-avatar">${r.avatar ? `<img src="${r.avatar}" alt="${r.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : r.name.trim().charAt(0)}</div>
                <div>
                  <div class="review-user-name">${r.name} ${r.verified ? '<span class="verified-badge"><i class="ti ti-discount-check"></i> خرید تایید شده</span>' : ""}</div>
                  <div class="review-date">${r.date}</div>
                </div>
              </div>
              <div class="stars">${starsHtml(String(r.rating))}</div>
              <div class="review-comment">${r.comment}</div>
              ${
                r.pros.length || r.cons.length
                  ? `<div class="review-proscons">
                      ${r.pros.map((p) => `<span class="p-item"><i class="ti ti-thumb-up"></i>${p}</span>`).join("")}
                      ${r.cons.map((c) => `<span class="c-item"><i class="ti ti-thumb-down"></i>${c}</span>`).join("")}
                    </div>`
                  : ""
              }
              <div class="review-card-footer">
                <button class="helpful-btn" data-helpful="${r.helpful}"><i class="ti ti-thumb-up"></i> مفید بود (<span>${r.helpful}</span>)</button>
              </div>
              ${
                r.reply
                  ? `<div class="store-reply"><strong>پاسخ پیکسل لایف:</strong> ${r.reply}</div>`
                  : ""
              }
            </div>`,
              ).join("")
              : '<div class="reviews-empty">هنوز نظری برای این محصول ثبت نشده است. اولین نفری باشید که نظر خود را ثبت می‌کند.</div>';
            updateRatingBreakdown();
            document.getElementById("loadMoreReviewsBtn").style.display =
              reviewsShown >= sorted.length ? "none" : "block";
            reviewsListEl.querySelectorAll(".helpful-btn").forEach((btn) => {
              btn.addEventListener("click", () => {
                if (btn.classList.contains("liked")) return;
                btn.classList.add("liked");
                const span = btn.querySelector("span");
                span.textContent = parseInt(span.textContent, 10) + 1;
              });
            });
          }
          renderReviews();
          document
            .getElementById("reviewsSortSelect")
            .addEventListener("change", () => {
              reviewsShown = 2;
              renderReviews();
            });
          document
            .getElementById("loadMoreReviewsBtn")
            .addEventListener("click", () => {
              reviewsShown += 2;
              renderReviews();
            });

          /* ══ REAL REVIEW SYSTEM LOGIC ══ */
          const reviewModal = document.getElementById("reviewModal");
          const reviewModalClose = document.getElementById("reviewModalClose");
          const submitReviewBtn = document.getElementById("submitReviewBtn");
          const starRatingInput = document.getElementById("starRatingInput");
          let currentReviewRating = 5;

          function openReviewModal() {
            reviewModal.classList.add("open");
            currentReviewRating = 5;
            updateStarInput(5);
            document.getElementById("reviewCommentInput").value = "";
            document.getElementById("reviewProsInput").value = "";
            document.getElementById("reviewConsInput").value = "";
          }

          function closeReviewModal() {
            reviewModal.classList.remove("open");
          }

          function updateStarInput(val) {
            starRatingInput.querySelectorAll("i").forEach((s, idx) => {
              s.classList.toggle("active", idx < val);
              s.className =
                idx < val ? "ti ti-star-filled active" : "ti ti-star";
            });
          }

          document
            .getElementById("writeReviewBtn")
            .addEventListener("click", openReviewModal);
          reviewModalClose.addEventListener("click", closeReviewModal);
          reviewModal.addEventListener("click", (e) => {
            if (e.target === reviewModal) closeReviewModal();
          });

          starRatingInput.addEventListener("click", (e) => {
            const star = e.target.closest("i");
            if (!star) return;
            currentReviewRating = parseInt(star.dataset.val, 10);
            updateStarInput(currentReviewRating);
          });

          submitReviewBtn.addEventListener("click", async () => {
            const comment = document
              .getElementById("reviewCommentInput")
              .value.trim();
            if (!comment) {
              showToast("لطفا متن نظر خود را وارد کنید");
              return;
            }
            const prosText = document
              .getElementById("reviewProsInput")
              .value.trim();
            const consText = document
              .getElementById("reviewConsInput")
              .value.trim();

            let userName = "کاربر مهمان";
            try {
              const u = JSON.parse(localStorage.getItem("user"));
              if (u) userName = u.mobile || u.email || "کاربر";
            } catch (e) {}

            const newReview = {
              productId: productId,
              userName: userName,
              rating: currentReviewRating,
              comment: comment,
              pros: prosText ? [prosText] : [],
              cons: consText ? [consText] : [],
              verified: false,
              helpful: 0,
              reply: null,
            };

            try {
              submitReviewBtn.disabled = true;
              submitReviewBtn.innerHTML =
                '<i class="ti ti-loader ti-spin"></i> در حال ثبت...';

              const reviewFormData = new FormData();
              Object.entries(newReview).forEach(([key, value]) => {
                reviewFormData.append(key, Array.isArray(value) ? JSON.stringify(value) : value);
              });
              const avatarFile = document.getElementById("reviewAvatarInput").files[0];
              if (avatarFile) reviewFormData.append("avatar", avatarFile);

              const response = await fetch("/api/reviews", {
                method: "POST",
                body: reviewFormData,
              });

              const data = await response.json();

              if (!response.ok || !data.success) {
                throw new Error(data.error || "ثبت نظر ناموفق بود");
              }

              if (data.success) {
                closeReviewModal();
                showToast("نظر شما ثبت شد و پس از تأیید مدیر نمایش داده می‌شود");
              }
            } catch (error) {
              showToast(error.message || "خطا در ثبت نظر");
            } finally {
              submitReviewBtn.disabled = false;
              submitReviewBtn.innerHTML = '<i class="ti ti-check"></i> ثبت نظر';
            }
          });

          document.querySelectorAll(".faq-item").forEach((item) => {
            item
              .querySelector(".faq-question")
              .addEventListener("click", () => {
                const wasOpen = item.classList.contains("open");
                document
                  .querySelectorAll(".faq-item")
                  .forEach((i) => i.classList.remove("open"));
                if (!wasOpen) item.classList.add("open");
              });
          });

          function miniCard(id, p) {
            return `
            <div class="slider-card">
              <a href="/product?id=${id}" style="color:inherit">
                <div class="slider-card-image">${productImageHtml(p, 0)}</div>
              </a>
              <div class="slider-card-body">
                <a href="/product?id=${id}" style="color:inherit">
                  <div class="slider-card-name">${p.name}</div>
                  <div class="stars">${starsHtml(p.rating)}</div>
                  <div class="slider-card-price">${p.price > 0 ? p.price.toLocaleString("fa-IR") : "—"} <span class="toman">تومان</span></div>
                </a>
                <div class="slider-card-actions">
                  <button class="slider-add-btn" data-id="${id}"><i class="ti ti-shopping-cart-plus"></i> افزودن</button>
                  <button class="slider-wish-btn" data-id="${id}"><i class="ti ti-heart"></i></button>
                </div>
              </div>
            </div>`;
          }

          async function loadRelatedProducts() {
            try {
              const res = await fetch(
                `/api/products?brand=${encodeURIComponent(product.brand)}&exclude=${productId}&limit=8`,
              );
              if (res.ok) {
                const data = await res.json();
                if (
                  data.success &&
                  Array.isArray(data.products) &&
                  data.products.length
                ) {
                  const mapped = data.products.map((d) => [
                    String(d._id),
                    mapDbProductToView(d),
                  ]);
                  // محصولات مشابهِ دریافت‌شده از API را نیز در منبع سبد خرید نگه می‌داریم.
                  // در غیر این صورت دکمه «افزودن» اطلاعات محصول را پیدا نمی‌کند.
                  mapped.forEach(([id, p]) => {
                    PRODUCTS[id] = p;
                  });
                  document.getElementById("relatedSlider").innerHTML = mapped
                    .map(([id, p]) => miniCard(id, p))
                    .join("");
                  return;
                }
              }
            } catch (e) {
              console.warn("محصولات مشابه از سرور دریافت نشد:", e);
            }
            // fallback فقط وقتی سرور چیزی نداد
            const relatedIds = Object.keys(PRODUCTS).filter(
              (id) =>
                id !== productId &&
                (PRODUCTS[id].brand === product.brand ||
                  !!PRODUCTS[id].isTablet === !!product.isTablet),
            );
            document.getElementById("relatedSlider").innerHTML = relatedIds
              .slice(0, 8)
              .map((id) => miniCard(id, PRODUCTS[id]))
              .join("");
          }
          deferNonCriticalWork(loadRelatedProducts);

          const recentIds = getRecentlyViewed().filter(
            (id) => id !== productId && PRODUCTS[id],
          );
          if (recentIds.length) {
            document.getElementById("recentlyViewedBlock").style.display = "";
            document.getElementById("recentSlider").innerHTML = recentIds
              .slice(0, 8)
              .map((id) => miniCard(id, PRODUCTS[id]))
              .join("");
          }

          // کارت‌های مشابه و بازدیدهای اخیر پس از آماده‌شدن صفحه ساخته می‌شوند.
          // بنابراین رویداد را روی document می‌گذاریم تا دکمه‌های جدید هم کار کنند.
          document.addEventListener("click", (event) => {
            const btn = event.target.closest(".slider-add-btn");
            if (!btn) return;

            event.preventDefault();
            const id = btn.dataset.id;
            const p = PRODUCTS[id];
            if (!p || p.outOfStock) {
              showToast("این محصول در حال حاضر ناموجود است");
              return;
            }

            const maxStock = Math.max(0, Number(p.stock) || 0);
            if (maxStock < 1) {
              showToast("این محصول در حال حاضر ناموجود است");
              return;
            }

            const cart = getCart();
            const existing = cart.find((item) => String(item.id) === String(id));
            if (existing) {
              const currentQty = cartQuantity(existing);
              if (currentQty >= maxStock) {
                showToast(`بیش از موجودی این کالا (${maxStock.toLocaleString("fa-IR")} عدد) نمی‌توانید اضافه کنید`);
                return;
              }
              existing.qty = currentQty + 1;
              existing.quantity = existing.qty;
              existing.stock = maxStock;
              existing.available = true;
            } else {
              cart.push({
                id,
                name: p.name,
                storage: p.storages?.[0] || "",
                color: p.colors?.[0]?.name || "",
                brand: p.brand || "",
                variant: p.storages?.[0] || "",
                image: p.images?.[0] || "",
                price: p.price,
                stock: maxStock,
                available: true,
                qty: 1,
              });
            }
            saveCart(cart);
            showToast("به سبد خرید اضافه شد");
          });

          document.querySelectorAll(".slider-wish-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.id;
              let list = getWishlist();
              if (!list.includes(id)) {
                list.push(id);
                saveWishlist(list);
                btn.querySelector("i").className = "ti ti-heart-filled";
                showToast("به علاقه‌مندی‌ها اضافه شد");
              }
            });
          });
          document.querySelectorAll(".slider-nav-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const track = document.getElementById(btn.dataset.slider);
              const dir = btn.classList.contains("slider-nav-next") ? -1 : 1;
              track.scrollBy({ left: dir * 220, behavior: "smooth" });
            });
          });

          const notifyBtn = document.getElementById("notifyBtn");
          if (notifyBtn) {
            notifyBtn.addEventListener("click", () => {
              showToast("به محض موجود شدن به شما اطلاع می‌دهیم");
            });
          }

          function addCurrentToCart() {
            const cart = getCart();
            const existing = cart.find(
              (item) =>
                item.id === productId &&
                item.storage === selectedStorage &&
                item.color === selectedColor.name,
            );
            if (existing) {
              const allowed = product._fromDb ? maxQuantity : 10;
              const requested = (existing.qty || 1) + qty;
              existing.qty = Math.min(requested, allowed);
              if (requested > allowed) {
                showToast(`تعداد این محصول در سبد به موجودی ${allowed.toLocaleString("fa-IR")} عدد محدود شد`);
              }
            } else {
              cart.push({
                id: productId,
                name: product.name,
                storage: selectedStorage,
                color: selectedColor.name,
                warranty: selectedWarranty,
                brand: product.brand || "",
                variant: selectedStorage,
                image: product.images?.[0] || "",
                price: product.price,
                stock: maxQuantity,
                qty: qty,
              });
            }
            saveCart(cart);
          }
          const addCartBtn = document.getElementById("addCartBtn");
          if (addCartBtn) {
            addCartBtn.addEventListener("click", () => {
              addCurrentToCart();
              showToast("به سبد خرید اضافه شد");
            });
          }

          const mobileAddCartBtn = document.getElementById("mobileAddCartBtn");
          if (mobileAddCartBtn) {
            mobileAddCartBtn.addEventListener("click", () => {
              addCurrentToCart();
              showToast("به سبد خرید اضافه شد");
            });
          }

          function initMobileProductFlow() {
            if (!window.matchMedia("(max-width: 768px)").matches) return;
            const productPageBody = document.getElementById("pageBody");
            const productLayout = productPageBody?.querySelector(".product-layout");
            const productGallery = productLayout?.querySelector(".product-gallery");
            const productInfo = productLayout?.querySelector(".product-info-col");
            if (!productPageBody || !productLayout || !productGallery || !productInfo) return;

            document.body.classList.remove("mobile-product-sheet-active");
            document.body.classList.add("mobile-product-flow-active");

            const keepGalleryVisible = () => {
              const viewport = window.visualViewport?.height || window.innerHeight;
              const height = Math.max(242, Math.min(310, viewport * 0.36));
              productGallery.style.height = height + "px";
            };

            // بخش‌های پایین صفحه را داخل همان جریان محصول قرار می‌دهیم تا
            // گالری تا پایان جزئیات، ثابت بماند و دیگر همراه جزئیات جابه‌جا نشود.
            const sectionBlocks = Array.from(pageBody.children).filter(
              (child) => child.classList?.contains("section-block"),
            );
            if (sectionBlocks.length) {
              const sectionNav = document.createElement("nav");
              sectionNav.className = "mobile-product-section-nav";
              sectionNav.setAttribute("aria-label", "بخش‌های محصول");
              const sectionLinks = [
                { target: "fullSpecsSection", label: "مشخصات" },
                { target: "productReviewSection", label: "بررسی تخصصی" },
                { target: "productReviewVideosSection", label: "ویدیوهای بررسی" },
                { target: "customerReviewsSection", label: "دیدگاه و پرسش" },
              ].filter(({ target }) => {
                const section = document.getElementById(target);
                return section && section.style.display !== "none";
              });
              sectionNav.innerHTML = sectionLinks
                .map(
                  ({ target, label }, index) =>
                    '<button type="button" class="mobile-product-section-tab' +
                    (index === 0 ? " is-active" : "") +
                    '" data-section-target="' + target + '">' + label + "</button>",
                )
                .join("");
              productInfo.after(sectionNav);
              sectionBlocks.forEach((section) => productLayout.append(section));

              sectionNav.addEventListener("click", (event) => {
                const tab = event.target.closest("[data-section-target]");
                if (!tab) return;
                const target = document.getElementById(tab.dataset.sectionTarget);
                if (!target) return;
                target.scrollIntoView({ behavior: "smooth", block: "start" });
              });

              const updateActiveSectionTab = () => {
                const tabs = Array.from(sectionNav.querySelectorAll("[data-section-target]"));
                let activeTarget = tabs[0]?.dataset.sectionTarget;
                for (const tab of tabs) {
                  const section = document.getElementById(tab.dataset.sectionTarget);
                  if (section && section.getBoundingClientRect().top <= 150) {
                    activeTarget = tab.dataset.sectionTarget;
                  }
                }
                tabs.forEach((tab) =>
                  tab.classList.toggle("is-active", tab.dataset.sectionTarget === activeTarget),
                );
              };
              let scrollTick = false;
              window.addEventListener(
                "scroll",
                () => {
                  if (scrollTick) return;
                  scrollTick = true;
                  requestAnimationFrame(() => {
                    scrollTick = false;
                    updateActiveSectionTab();
                  });
                },
                { passive: true },
              );
              updateActiveSectionTab();
            }

            keepGalleryVisible();
            let resizeFrame = 0;
            const queueGalleryResize = () => {
              cancelAnimationFrame(resizeFrame);
              resizeFrame = requestAnimationFrame(keepGalleryVisible);
            };
            window.addEventListener("resize", queueGalleryResize);
            window.visualViewport?.addEventListener("resize", queueGalleryResize);
          }

          initMobileProductFlow();

          // بارگذاری نظرات ذخیره‌شده پس از آماده‌شدن صفحه
          deferNonCriticalWork(fetchReviews);
        }
      })();
    </script>
      <script src="/js/shopping-assistant.js?v=13" defer></script>
      <script src="/js/product-ratings.js?v=2" defer></script>
  </body>
