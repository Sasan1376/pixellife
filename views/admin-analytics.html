<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آمار بازدید | پیکسل‌لایف</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="/vendor/adminlte/css/adminlte.rtl.min.css"><link rel="stylesheet" href="/css/admin-light.css"><style>body{font-family:Vazirmatn,Tahoma,sans-serif}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.stat b{display:block;font-size:28px;margin:8px 0}.muted{font-size:13px;color:#64748b}.row-page{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf2f7}</style></head><body class="layout-fixed sidebar-expand-lg"><div class="app-wrapper"><aside class="app-sidebar bg-white shadow-sm"><div class="sidebar-brand"><a href="/admin/products" class="brand-link">پیکسل<span>لایف</span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="/admin/products" class="nav-link"><p>محصولات</p></a></li><li class="nav-item"><a href="/admin/customers" class="nav-link"><p>مشتریان</p></a></li><li class="nav-item"><a href="/admin/orders" class="nav-link"><p>سفارش‌ها</p></a></li><li class="nav-item"><a href="/admin/analytics" class="nav-link active"><p>آمار بازدید</p></a></li></ul></nav></div></aside><main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3>آمار بازدید سایت</h3><p class="text-muted">آمار از زمان فعال‌سازی این بخش ثبت می‌شود.</p></div></div><div class="app-content"><div class="container-fluid"><div class="row g-3"><div class="col-md-4"><div class="stat">بازدید امروز<b id="today">۰</b><span class="muted" id="todayU"></span></div></div><div class="col-md-4"><div class="stat">بازدید ۷ روز اخیر<b id="week">۰</b><span class="muted" id="weekU"></span></div></div><div class="col-md-4"><div class="stat">بازدید ۳۰ روز اخیر<b id="month">۰</b><span class="muted" id="monthU"></span></div></div><div class="col-12"><div class="card"><div class="card-body"><h5>پربازدیدترین صفحه‌ها</h5><div id="pages" class="muted">در حال بارگذاری…</div></div></div></div></div></div></div></main></div><script>const f=n=>Number(n||0).toLocaleString('fa-IR');fetch('/admin/api/analytics/overview',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.success)throw 0;[['today','todayU'],['week','weekU'],['month','monthU']].forEach(([a,b])=>{document.getElementById(a).textContent=f(d[a].views);document.getElementById(b).textContent=f(d[a].uniqueVisitors)+' بازدیدکنندهٔ یکتا'});document.getElementById('pages').innerHTML=d.topPages.length?d.topPages.map(x=>'<div class="row-page"><span dir="ltr">'+x.page+'</span><b>'+f(x.views)+'</b></div>').join(''):'هنوز بازدیدی ثبت نشده است.'}).catch(()=>document.getElementById('pages').textContent='خطا در دریافت آمار');</script><script src="/js/admin-sidebar.js?v=5" defer></script></body></html>
