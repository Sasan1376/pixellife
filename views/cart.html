      /* ═══ کد تخفیف ═══ */
      document

      document

          if (e.key === "Enter") applyCoupon();
        });

      function applyCoupon() {
        const input = document.getElementById("couponInput");
        const msg = document.getElementById("couponMsg");
        const code = input.value.trim().toUpperCase();

        input.classList.remove("input-error", "input-success");
        msg.style.display = "none";

        if (!code) {
          input.classList.add("input-error");
          msg.className = "coupon-msg error";
          msg.style.display = "flex";
          msg.innerHTML =
            '<i class="ti ti-alert-circle"></i> لطفاً کد تخفیف را وارد کنید';
          return;
        }

        if (appliedCoupon) {
          input.classList.add("input-error");
          msg.className = "coupon-msg error";
          msg.style.display = "flex";
          msg.innerHTML =
            '<i class="ti ti-alert-circle"></i> قبلاً یک کد تخفیف اعمال شده است';
          return;
        }

        const coupon = validCoupons[code];
        if (!coupon) {
          input.classList.add("input-error");
          msg.className = "coupon-msg error";
          msg.style.display = "flex";
          msg.innerHTML =
            '<i class="ti ti-alert-circle"></i> کد تخفیف نامعتبر است';
          input.classList.add("shake");
          setTimeout(() => input.classList.remove("shake"), 300);
          return;
        }

        /* محاسبه مبلغ تخفیف */
        const availableSubtotal = cartData
          .filter((i) => i.available)
          .reduce((s, i) => s + i.price * i.quantity, 0);
        if (coupon.type === "percent") {
          couponDiscount = Math.min(
            Math.round((availableSubtotal * coupon.value) / 100),
            coupon.max,
          );
        } else {
          couponDiscount = coupon.value;
        }

        appliedCoupon = code;
        input.classList.add("input-success");
        msg.className = "coupon-msg success";
        msg.style.display = "flex";
        msg.innerHTML =
          '<i class="ti ti-circle-check"></i> کد تخفیف با موفقیت اعمال شد';

        document.getElementById("couponAppliedTag").style.display = "block";
        document.getElementById("couponAppliedTag").innerHTML = `
          <div class="coupon-applied-tag">
            <i class="ti ti-ticket"></i> ${coupon.label}
            <button onclick="removeCoupon()" aria-label="حذف کد تخفیف"><i class="ti ti-x"></i></button>
          </div>
        `;

        document.getElementById("couponRow").style.display = "none";
        updateSummary();
      }

      function removeCoupon() {
        couponDiscount = 0;
        appliedCoupon = null;
        document.getElementById("couponInput").value = "";
        document
          .getElementById("couponInput")
          .classList.remove("input-error", "input-success");
        document.getElementById("couponMsg").style.display = "none";
        document.getElementById("couponAppliedTag").style.display = "none";
        document.getElementById("couponRow").style.display = "flex";
        updateSummary();
        showToast("کد تخفیف حذف شد");
      }

      /* ═══ حالت سبد خالی ═══ */
      function showEmptyState() {
        document.getElementById("cartContent").style.display = "none";
        document.getElementById("cartEmpty").classList.add("show");
        document.getElementById("mobileBar").style.display = "none";
      }

      /* ═══ بج سبد خرید هدر ═══ */
      function updateCartBadge() {
        const count = cartData
          .filter((i) => i.available)
          .reduce((s, i) => s + i.quantity, 0);
        const badge = document.getElementById("cartCount");
        if (count > 0) {
          badge.style.display = "flex";
          badge.textContent = toPersian(count);
        } else {
          badge.style.display = "none";
        }
      }

      /* ═══ لودینگ اولیه ═══ */
      function initCartPage() {
        loadCheckoutAddress();
        setTimeout(() => {
          document.getElementById("cartSkeleton").style.display = "none";
          if (cartData.length > 0) {
            document.getElementById("cartContent").style.display = "block";
            renderCartItems();
            enrichCartImages();
          } else {
            showEmptyState();
          }
        }, 1200);
      }

      /* ═══ ریسپانسیو: نوار موبایل ═══ */
      window.addEventListener("resize", () => {
        const availableItems = cartData.filter((i) => i.available);
        const mobileBar = document.getElementById("mobileBar");
        if (availableItems.length > 0 && window.innerWidth <= 768) {
          mobileBar.style.display = "block";
        } else {
          mobileBar.style.display = "none";
        }
      });

      /* ═══ دکمه پرداخت موبایل ═══ */
      document
        .getElementById("mobileCheckoutBtn")
        .addEventListener("click", () => {
          document.getElementById("checkoutBtn").click();
        });

      /* ═══ دکمه تکمیل سفارش ═══ */
      document.getElementById("checkoutBtn").addEventListener("click", async () => {
        const availableItems = cartData.filter((i) => i.available);
        if (availableItems.length === 0) {
          showToast("سبد خرید شما خالی است");
          return;
        }
        const button = document.getElementById("checkoutBtn");
        button.disabled = true;
        try {
          if (!checkoutAddress) await loadCheckoutAddress();
          if (!checkoutAddress) {
            window.location.href = "/profile/addresses";
            return;
          }
          const response = await fetch("/api/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              addressId: checkoutAddress._id,
              items: availableItems.map((item) => ({
                productId: item.id,
                quantity: getCartQuantity(item),
                color: item.color,
                storage: item.variant,
                warranty: item.warranty,
              })),
            }),
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.message || "ثبت سفارش ناموفق بود");
          cartData = cartData.filter((item) => !item.available);
          saveCart();
          showToast(`سفارش ${result.order.orderNumber} ثبت شد`);
          setTimeout(() => { window.location.href = "/profile/orders"; }, 900);
        } catch (error) {
          showToast(error.message || "ثبت سفارش ناموفق بود");
        } finally {
          button.disabled = false;
        }
      });

      /* ═══════════════════════════════════════════
         کدهای موجود سایت (همانند صفحه اصلی - کامل)
         ═══════════════════════════════════════════ */

      /* ══ DARK MODE TOGGLE ══ */
      const themeToggleBtn = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      function updateThemeIcon(theme) {
        if (!themeIcon) return;
        themeIcon.className = theme === "dark" ? "ti ti-sun" : "ti ti-moon";
      }

      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        updateThemeIcon(theme);
      }

      function initTheme() {
        const current =
          document.documentElement.getAttribute("data-theme") || "light";
        updateThemeIcon(current);
      }

      if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", () => {
          const current =
            document.documentElement.getAttribute("data-theme") || "light";
          setTheme(current === "dark" ? "light" : "dark");
        });
      }

      if (window.matchMedia) {
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", (e) => {
            if (!localStorage.getItem("theme")) {
              updateThemeIcon(e.matches ? "dark" : "light");
              document.documentElement.setAttribute(
                "data-theme",
                e.matches ? "dark" : "light",
              );
            }
          });
      }

      initTheme();

      /* ══ TOAST ══ */
      function showToast(text) {
        const t = document.getElementById("toast");
        document.getElementById("toastText").textContent = text;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      /* ══ API HELPER ══ */
      async function apiCall(url, data) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.message || "خطا در ارتباط با سرور");
        }
        return json;
      }

      /* ══ AUTH STATE ══ */
      const MOBILE_RE = /^(\+98|0098|0)?9\d{9}$/;

      function normalizeIdentifier(v) {
        v = v.trim();
        if (MOBILE_RE.test(v.replace(/(\+98|0098)/, "0"))) {
          return v.replace(/(\+98|0098)/, "0");
        }
        return v.toLowerCase();
      }

      function getDisplayName(user) {
        const fullName = [user.firstName, user.lastName]
          .filter(Boolean)
          .join(" ")
          .trim();
        if (fullName) return fullName;
        if (user.mobile) return user.mobile;
        if (user.email) return user.email;
        return "کاربر";
      }

      function applyLogin(user, token) {
        document.body.classList.add("logged-in");
        const disp = getDisplayName(user);
        const ch = disp.replace(/\D/g, "").slice(0, 1) || "ک";
        document.getElementById("profileAvatar").textContent = ch;
        document.getElementById("profileName").textContent = disp;
        document.getElementById("pdropAvatar").textContent = ch;
        document.getElementById("pdropName").textContent = disp;
        const mobileRaw = user.mobile || "";
        const fmt = mobileRaw.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
        document.getElementById("pdropMobile").textContent =
          fmt || user.email || "";
        if (token) localStorage.setItem("authToken", token);
        localStorage.setItem("user", JSON.stringify(user));
      }

      function applyLogout() {
        document.body.classList.remove("logged-in");
        document.getElementById("profileDropdown").classList.remove("open");
        document.getElementById("profileTrigger").classList.remove("open");
        localStorage.removeItem("user");
        localStorage.removeItem("authToken");
      }

      /* ══ STEP NAVIGATION ══ */
      const steps = [
        "stepIdentifier",
        "stepMethod",
        "stepOtp",
        "stepPassword",
        "stepSuccess",
      ];
      let otpTimerInterval = null;
      let currentIdentifier = "";
      let currentUserInfo = null;

      function showStep(name) {
        steps.forEach((s) => {
          const el = document.getElementById(s);
          if (el) el.classList.toggle("active", s === name);
        });
      }

      function startOtpTimer(sec) {
        clearInterval(otpTimerInterval);
        const timerTxt = document.getElementById("otpTimerTxt");
        const timerCount = document.getElementById("timerCount");
        const resendBtn = document.getElementById("resendBtn");
        timerTxt.style.display = "inline";
        resendBtn.style.display = "none";
        let remaining = sec;
        function tick() {
          const m = String(Math.floor(remaining / 60)).padStart(2, "0");
          const s = String(remaining % 60).padStart(2, "0");
          timerCount.textContent = m + ":" + s;
          if (remaining <= 0) {
            clearInterval(otpTimerInterval);
            timerTxt.style.display = "none";
            resendBtn.style.display = "inline-flex";
          }
          remaining--;
        }
        tick();
        otpTimerInterval = setInterval(tick, 1000);
      }

      function shakeError(inputId, errorId, msg) {
        const inp = document.getElementById(inputId);
        const err = document.getElementById(errorId);
        if (msg) {
          err.textContent = msg;
          err.classList.add("show");
          inp.classList.add("input-error");
        } else {
          err.classList.remove("show");
          inp.classList.remove("input-error");
        }
        inp.style.animation = "none";
        setTimeout(() => {
          inp.style.animation = "shake .3s ease";
        }, 10);
      }

      function clearError(inputId, errorId) {
        document.getElementById(inputId).classList.remove("input-error");
        document.getElementById(errorId).classList.remove("show");
      }

      /* ══ STEP 1 → 2: ادامه ══ */
      async function handleContinue() {
        const raw = document.getElementById("identifierInput").value.trim();
        if (!raw) {
          shakeError(
            "identifierInput",
            "identifierError",
            "شماره موبایل یا ایمیل الزامی است",
          );
          return;
        }
        if (!MOBILE_RE.test(raw) && !/^\S+@\S+\.\S+$/.test(raw)) {
          shakeError(
            "identifierInput",
            "identifierError",
            "فرمت شماره موبایل یا ایمیل معتبر نیست",
          );
          return;
        }
        clearError("identifierInput", "identifierError");

        const identifier = normalizeIdentifier(raw);
        const btn = document.getElementById("continueBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> بررسی...';

        try {
          const resp = await apiCall("/api/auth/check-user", { identifier });
          currentIdentifier = identifier;
          currentUserInfo = resp.data;

          document.getElementById("methodIdentifierDisplay").textContent =
            identifier;
          showStep("stepMethod");
        } catch (err) {
          shakeError("identifierInput", "identifierError", err.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-arrow-left"></i> ادامه';
        }
      }

      /* ══ STEP 2: ارسال OTP ══ */
      async function handleSendOtp() {
        const btn = document.getElementById("sendOtpBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> ارسال...';

        try {
          const type = currentUserInfo.exists ? "login" : "register";
          await apiCall("/api/auth/send-otp", {
            identifier: currentIdentifier,
            type,
          });

          document.getElementById("otpTarget").textContent = currentIdentifier;
          document.getElementById("otpInput").value = "";
          clearError("otpInput", "otpError");
          showStep("stepOtp");
          startOtpTimer(120);
          setTimeout(() => document.getElementById("otpInput").focus(), 200);
        } catch (err) {
          showToast(err.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML =
            '<i class="ti ti-device-mobile-message"></i> ارسال کد تأیید';
        }
      }

      /* ══ STEP 2: نمایش فرم رمز عبور ══ */
      function handleShowPassword() {
        clearError("passwordInput", "passwordError");
        document.getElementById("passwordInput").value = "";
        showStep("stepPassword");
        setTimeout(() => document.getElementById("passwordInput").focus(), 200);
      }

      /* ══ STEP 3A: تأیید OTP ══ */
      async function handleVerifyOtp() {
        const code = document.getElementById("otpInput").value.trim();
        if (!/^\d{5}$/.test(code)) {
          shakeError("otpInput", "otpError", "کد باید ۵ رقم باشد");
          return;
        }

        const btn = document.getElementById("verifyOtpBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> تأیید...';

        try {
          const resp = await apiCall("/api/auth/verify-login-otp", {
            identifier: currentIdentifier,
            code,
          });
          clearInterval(otpTimerInterval);
          applyLogin(resp.user, resp.token);
          document.getElementById("successDesc").textContent =
            "ورود شما با موفقیت انجام شد.";
          showStep("stepSuccess");
          setTimeout(() => {
            closeLoginModal();
            showToast("خوش آمدید!");
          }, 1800);
        } catch (err) {
          shakeError("otpInput", "otpError", err.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-login"></i> تأیید و ورود';
        }
      }

      /* ══ STEP 3B: ورود با رمز عبور ══ */
      async function handlePasswordLogin() {
        const password = document.getElementById("passwordInput").value;
        if (!password) {
          shakeError("passwordInput", "passwordError", "رمز عبور را وارد کنید");
          return;
        }
        clearError("passwordInput", "passwordError");

        const btn = document.getElementById("passwordLoginBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> ورود...';

        try {
          const resp = await apiCall("/api/auth/login", {
            identifier: currentIdentifier,
            password,
          });
          applyLogin(resp.user, resp.token);
          document.getElementById("successDesc").textContent =
            "ورود شما با موفقیت انجام شد.";
          showStep("stepSuccess");
          setTimeout(() => {
            closeLoginModal();
            showToast("خوش آمدید!");
          }, 1800);
        } catch (err) {
          shakeError("passwordInput", "passwordError", err.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-login"></i> ورود';
        }
      }

      /* ══ ارسال مجدد OTP ══ */
      async function handleResendOtp() {
        const btn = document.getElementById("resendBtn");
        btn.disabled = true;
        try {
          const type = currentUserInfo.exists ? "login" : "register";
          await apiCall("/api/auth/resend-otp", {
            identifier: currentIdentifier,
            type,
          });
          startOtpTimer(120);
          showToast("کد جدید ارسال شد");
        } catch (err) {
          showToast(err.message);
        } finally {
          btn.disabled = false;
        }
      }

      /* ══ فراموشی رمز عبور ══ */
      async function handleForgotPassword() {
        try {
          await apiCall("/api/auth/forgot-password", {
            identifier: currentIdentifier,
          });
          document.getElementById("otpTarget").textContent = currentIdentifier;
          document.getElementById("otpInput").value = "";
          clearError("otpInput", "otpError");
          showStep("stepOtp");
          startOtpTimer(120);
          showToast("کد بازیابی ارسال شد");
        } catch (err) {
          showToast(err.message);
        }
      }

      /* ══ MODAL OPEN/CLOSE ══ */
      const loginModal = document.getElementById("loginModal");
      function openLoginModal() {
        loginModal.classList.add("open");
        document.getElementById("identifierInput").value = "";
        clearError("identifierInput", "identifierError");
        showStep("stepIdentifier");
        setTimeout(
          () => document.getElementById("identifierInput").focus(),
          250,
        );
      }
      function closeLoginModal() {
        loginModal.classList.remove("open");
        clearInterval(otpTimerInterval);
      }

      /* ══ EVENT BINDINGS ══ */
      document
        .getElementById("continueBtn")
        .addEventListener("click", handleContinue);
      document
        .getElementById("sendOtpBtn")
        .addEventListener("click", handleSendOtp);
      document
        .getElementById("showPasswordBtn")
        .addEventListener("click", handleShowPassword);
      document
        .getElementById("verifyOtpBtn")
        .addEventListener("click", handleVerifyOtp);
      document
        .getElementById("passwordLoginBtn")
        .addEventListener("click", handlePasswordLogin);
      document
        .getElementById("resendBtn")
        .addEventListener("click", handleResendOtp);
      document
        .getElementById("forgotPasswordLink")
        .addEventListener("click", handleForgotPassword);

      document
        .getElementById("backFromMethod")
        .addEventListener("click", () => showStep("stepIdentifier"));
      document
        .getElementById("backFromOtp")
        .addEventListener("click", () =>
          showStep(
            currentUserInfo && currentUserInfo.hasPassword
              ? "stepMethod"
              : "stepIdentifier",
          ),
        );
      document
        .getElementById("backFromPassword")
        .addEventListener("click", () => showStep("stepMethod"));

      // Enter key
      document
        .getElementById("identifierInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") handleContinue();
        });
      document.getElementById("otpInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleVerifyOtp();
      });
      document
        .getElementById("passwordInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") handlePasswordLogin();
        });

      // Toggle password visibility
      document
        .getElementById("togglePassword")
        .addEventListener("click", () => {
          const inp = document.getElementById("passwordInput");
          const ico = document.querySelector("#togglePassword i");
          if (inp.type === "password") {
            inp.type = "text";
            ico.className = "ti ti-eye-off";
          } else {
            inp.type = "password";
            ico.className = "ti ti-eye";
          }
        });

      document
        .getElementById("loginModalClose")
        .addEventListener("click", closeLoginModal);
      loginModal.addEventListener("click", (e) => {
        if (e.target === loginModal) closeLoginModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && loginModal.classList.contains("open"))
          closeLoginModal();
      });

      // Logout
      document.getElementById("logoutBtn").addEventListener("click", () => {
        applyLogout();
        showToast("با موفقیت خارج شدید");
      });

      // Restore auth state on load
      (function () {
        try {
          const saved = localStorage.getItem("user");
          if (saved) {
            const u = JSON.parse(saved);
            if (u) applyLogin(u, null);
          }
        } catch (e) {}
      })();

      /* ══ PROFILE DROPDOWN ══ */
      const profileTrigger = document.getElementById("profileTrigger");
      const profileDropdown = document.getElementById("profileDropdown");
      profileTrigger.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = profileDropdown.classList.toggle("open");
        profileTrigger.classList.toggle("open", open);
      });
      document.addEventListener("click", (e) => {
        if (
          !profileTrigger.contains(e.target) &&
          !profileDropdown.contains(e.target)
        ) {
          profileDropdown.classList.remove("open");
          profileTrigger.classList.remove("open");
        }
      });

      /* ══ MEGA MENU (digikala style) ══ */
      const categoriesData = [

          icon: "ti-device-mobile",

          ],
          seeAllHref: "/mobile",
        },
        {

          name: "تبلت",
          icon: "ti-device-tablet",
          links: [
            { label: "خرید تبلت اپل", href: "/ipad" },
            { label: "خرید تبلت سامسونگ", href: "/samsungtab" },
            { label: "خرید تبلت شیائومی", href: "xiaomitab" },
          ],
          seeAllHref: "#",
        },
        {

          name: "هدفون و هندزفری",
          icon: "ti-headphones",
          links: [
            { label: "خرید هدفون اپل", href: "/headphone/apple" },

          links: [

          ],
          seeAllHref: "/watch",
        },
        {

          icon: "ti-device-gamepad-2",
          links: [{ label: "خرید کنسول سونی", href: "/console/sony" }],
          seeAllHref: "/console",
        },
      ];

      const megamenuCats = document.getElementById("megamenuCats");
      const megamenuContent = document.getElementById("megamenuContent");

      categoriesData.forEach((cat, idx) => {
        const catBtn = document.createElement("button");
        catBtn.className = "megamenu-cat-btn" + (idx === 0 ? " active" : "");
        catBtn.dataset.cat = cat.id;
        catBtn.innerHTML = `
          <i class="ti ${cat.icon} cat-ico"></i>
          <span>${cat.name}</span>
          <i class="ti ti-chevron-left cat-arrow"></i>`;
        megamenuCats.appendChild(catBtn);

        const panel = document.createElement("div");
        panel.className =
          "megamenu-content-panel" + (idx === 0 ? " active" : "");
        panel.dataset.catPanel = cat.id;
        panel.innerHTML = `
          <div class="megamenu-content-title"><i class="ti ${cat.icon}"></i>${cat.name}</div>
          <div class="megamenu-links">
            ${cat.links
              .map(
                (l) =>
                  `<a href="${l.href}" class="megamenu-link">${l.label}<i class="ti ti-chevron-left"></i></a>`,
              )
              .join("")}
            <a href="${cat.seeAllHref}" class="megamenu-link see-all">مشاهده همه ${cat.name}<i class="ti ti-arrow-left"></i></a>
          </div>`;
        megamenuContent.appendChild(panel);

        function activateCat() {
          megamenuCats
            .querySelectorAll(".megamenu-cat-btn")
            .forEach((b) => b.classList.remove("active"));
          megamenuContent
            .querySelectorAll(".megamenu-content-panel")
            .forEach((p) => p.classList.remove("active"));
          catBtn.classList.add("active");
          panel.classList.add("active");
        }
        catBtn.addEventListener("click", activateCat);
        catBtn.addEventListener("mouseenter", activateCat);
      });

      const catsToggle = document.getElementById("catsToggle");
      const megamenuPanel = document.getElementById("megamenuPanel");
      const megamenuBackdrop = document.getElementById("megamenuBackdrop");
      const navCatsWrap = document.querySelector(".nav-cats-wrap");
      let megamenuOpen = false;
      let megamenuCloseTimer = null;

      function openMegamenu() {
        clearTimeout(megamenuCloseTimer);
        megamenuOpen = true;
        megamenuPanel.classList.add("open");
        megamenuBackdrop.classList.add("open");
        catsToggle.classList.add("active");
      }
      function closeMegamenu() {
        megamenuOpen = false;
        megamenuPanel.classList.remove("open");
        megamenuBackdrop.classList.remove("open");
        catsToggle.classList.remove("active");
      }
      function scheduleClose() {
        clearTimeout(megamenuCloseTimer);
        megamenuCloseTimer = setTimeout(closeMegamenu, 200);
      }

      navCatsWrap.addEventListener("mouseenter", openMegamenu);
      navCatsWrap.addEventListener("mouseleave", scheduleClose);

      catsToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        megamenuOpen ? closeMegamenu() : openMegamenu();
      });
      megamenuBackdrop.addEventListener("click", closeMegamenu);
      document.addEventListener("click", (e) => {
        if (
          megamenuOpen &&
          !megamenuPanel.contains(e.target) &&
          !catsToggle.contains(e.target)
        ) {
          closeMegamenu();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && megamenuOpen) closeMegamenu();
      });

      /* ══ SEARCH ══ */
      document
        .getElementById("searchInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.value.trim()) e.target.blur();
        });

      /* ══ اجرای صفحه سبد خرید ══ */
      initCartPage();
    </script>
    <script>
      // فرمت کردن اعداد به صورت فارسی
      function toPersianNum(n) {
        return n.toLocaleString("fa-IR");
      }

      // تابع کمکی برای خواندن تعداد
      function getItemQty(item) {
        return getCartQuantity(item);
      }

      // تابع همگام‌سازی کامل با صفحه سبد خرید
      function syncCartPage() {
        if (typeof cartData !== "undefined") {
          try {
            cartData = JSON.parse(localStorage.getItem("digishop_cart")) || [];

            // 🚀 نکته مهم: افزودن ویژگی‌های مفقود تا cart.html بتواند آن‌ها را محاسبه کند
            cartData.forEach((item) => {
              normalizeCartItem(item);
              if (item.originalPrice === undefined)
                item.originalPrice = item.price || 0;
              if (item.brand === undefined) item.brand = "";
              if (item.color === undefined) item.color = "—";
              if (item.variant === undefined) item.variant = "—";
              if (item.warranty === undefined) item.warranty = "—";
              if (item.discount === undefined) item.discount = 0;
              if (item.image === undefined) item.image = "";
            });
          } catch (e) {
            cartData = [];
          }
        }

        // ۱. رندر مجدد لیست محصولات در سبد خرید
        if (typeof renderCartItems === "function") {
          renderCartItems();
        }

        // ۲. رندر مجدد بخش خلاصه سفارش (قیمت‌ها، مالیات، ارسال و...)
        if (typeof updateSummary === "function") {
          updateSummary();
        }

        // ۳. آپدیت badge سبد خرید
        if (typeof updateCartBadge === "function") {
          updateCartBadge();
        }
      }

      // رندر کردن آیتم‌های سبد در باکس کوچک (Dropdown)
      function renderMiniCart() {
        let cart = [];
        try {
          cart = JSON.parse(localStorage.getItem("digishop_cart")) || [];
        } catch (e) {}

        const itemsContainer = document.getElementById("miniCartItems");
        const footer = document.getElementById("miniCartFooter");
        const badge = document.getElementById("cartCount");

        // اگر سبد خالی بود
        if (cart.length === 0) {
          if (itemsContainer)
            itemsContainer.innerHTML =
              '<div class="mini-cart-empty">سبد خرید شما خالی است</div>';
          if (footer) footer.style.display = "none";
          if (badge) badge.style.display = "none";

          syncCartPage();
          return;
        }

        let total = 0;
        let totalQty = 0;

        // ساخت HTML برای هر محصول
        if (itemsContainer) {
          itemsContainer.innerHTML = cart
            .map((item) => {
              let currentQty = getItemQty(item);
              let itemTotal = (item.price || 0) * currentQty;
              total += itemTotal;
              totalQty += currentQty;

              return `
          <div class="mini-cart-item" data-id="${item.id}">
            <img src="${item.image || "https://placehold.co/50x50/f1f5f9/94a3b8?text=Img"}" alt="${item.name}" class="mini-cart-img">
            <div class="mini-cart-info">
              <div class="mini-cart-name">${item.name}</div>
              <div class="mini-cart-price">${toPersianNum(item.price || 0)} تومان</div>
            </div>
            <div class="mini-cart-actions">
              <button class="mini-remove-btn" onclick="removeFromMiniCart('${item.id}')">
                <i class="ti ti-trash"></i>
              </button>
              <div class="mini-qty-controls">
                <button class="mini-qty-btn" onclick="changeMiniCartQty('${item.id}', -1)" ${currentQty <= 1 ? "disabled" : ""}>−</button>
                <span class="mini-qty-val">${toPersianNum(currentQty)}</span>
                <button class="mini-qty-btn" onclick="changeMiniCartQty('${item.id}', 1)" ${!item.available || currentQty >= getCartStock(item) ? "disabled" : ""}>+</button>
              </div>
            </div>
          </div>
        `;
            })
            .join("");
        }

        // نمایش فوتر و مجموع در باکس کوچک
        if (footer) footer.style.display = "block";
        const totalEl = document.getElementById("miniCartTotalPrice");
        if (totalEl) totalEl.textContent = toPersianNum(total) + " تومان";

        if (badge) {
          badge.style.display = "flex";
          badge.textContent = toPersianNum(totalQty);
        }

        // همگام‌سازی با صفحه سبد خرید در صورت باز بودن آن
        syncCartPage();
      }

      // تغییر تعداد محصول در باکس کوچک
      function changeMiniCartQty(id, delta) {
        let cart = JSON.parse(localStorage.getItem("digishop_cart")) || [];
        const item = cart.find((i) => String(i.id) === String(id));
        if (!item) return;

        normalizeCartItem(item);
        const maxStock = getCartStock(item);
        let currentQty = getItemQty(item) + delta;
        if (currentQty < 1) currentQty = 1;
        if (delta > 0 && (!item.available || currentQty > maxStock)) {
          showToast("تعداد انتخابی به سقف موجودی این کالا رسیده است");
          return;
        }
        currentQty = Math.min(currentQty, maxStock || 1);

        // همگام‌سازی هر دو فیلد برای تمام صفحه‌ها
        item.qty = currentQty;
        item.quantity = currentQty;

        localStorage.setItem("digishop_cart", JSON.stringify(cart));
        renderMiniCart(); // رندر مجدد باکس و صفحه سبد
      }

      // حذف محصول از باکس کوچک
      function removeFromMiniCart(id) {
        let cart = JSON.parse(localStorage.getItem("digishop_cart")) || [];
        cart = cart.filter((i) => String(i.id) !== String(id));
        localStorage.setItem("digishop_cart", JSON.stringify(cart));
        renderMiniCart(); // رندر مجدد باکس و صفحه سبد
      }

      // لود شدن باکس هنگام باز کردن صفحه
      document.addEventListener("DOMContentLoaded", renderMiniCart);

      // همگام‌سازی خودکار اگر در تب دیگری تغییراتی انجام شود
      window.addEventListener("storage", function (e) {
        if (e.key === "digishop_cart") {
          renderMiniCart();
        }
      });
    </script>
    <script src="/auth-modal.js"></script>
  </body>
</html>
